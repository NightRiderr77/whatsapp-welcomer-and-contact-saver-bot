# WhatsApp Welcomer & Contact Saver Bot
# Built by NightRiderr77 · Property of PXN STORES LK · https://pxnstores.lk
#
#   docker compose up -d --build
#
# First run: `docker compose logs -f` and scan the QR with the OWNER phone.
# To link with a code instead, set PAIR_NUMBER below to the owner's number.
services:
  welcomer-bot:
    build: .
    container_name: welcomer-bot
    # Pinned, because Chromium stamps the hostname into the profile lock. Left
    # to Docker it is a new random id on every rebuild, so yesterday's lock
    # always reads as "in use by another computer" and the browser won't start.
    hostname: welcomer-bot
    restart: unless-stopped
    environment:
      # The bot is light, but Chromium is not — cap Node's heap so the two
      # together stay inside a small VPS.
      - NODE_OPTIONS=--max-old-space-size=256
      # REQUIRED for the dashboard. Without it the panel does not start at all
      # — it listens on a public port, so "no password" would mean "no lock".
      - DASH_PASSWORD=${DASH_PASSWORD:?set DASH_PASSWORD in .env before starting}
      # - PAIR_NUMBER=947XXXXXXXX   # link with an 8-digit code instead of a QR
    ports:
      # The owner panel. Change the left-hand side to 127.0.0.1:8091 to keep it
      # off the internet and reach it over an SSH tunnel instead.
      - "8091:8091"
    volumes:
      # The WhatsApp login. Delete this to force a fresh QR.
      - ./.wwebjs_auth:/app/.wwebjs_auth
      # settings.json plus who has been greeted / saved already.
      #
      # Only ever mount DIRECTORIES here. Docker silently creates a *directory*
      # when a bind-mounted file is missing on the host, and settings.json used
      # to be mounted as a file: one missing file made every read fail, the bot
      # fell back to defaults, and every customer was saved as "Cus 1".
      - ./state:/app/state
    deploy:
      resources:
        limits:
          # CPU only, deliberately. A memory cap here is a trap: Chromium's
          # renderer is killed by the cgroup long before Node notices, the
          # WhatsApp page reloads, whatsapp-web.js re-injects and re-emits
          # `authenticated`, and after enough of that WhatsApp unlinks the
          # device — which looks like a login problem and is really a RAM one.
          # WhatsApp Web wants roughly a gigabyte to itself on a bad day.
          cpus: "1.0"
